name: Update run_forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: write

concurrency:
  group: forecast-dashboard-update
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pandas requests h5py "tensorflow==2.10.*"

      - name: Run forecast script
        run: |
          python -u scripts/run_forecast.py

      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A data

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update forecast data"
            git pull --rebase
            git push
          fi
